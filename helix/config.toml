theme = "catppuccin_mocha"

[editor]
# gutters = ["diagnostics"]
true-color = true
mouse = true
auto-pairs = false
soft-wrap.enable = true
clipboard-provider = "wayland"

[editor.file-picker]
hidden = false

[editor.lsp]
display-messages = true

[keys.normal]
C-s = ":write-all"

[keys.insert]
C-s = [":write-all", "normal_mode"]
